    // Keeping ALL your original functions intact
    function formatInEasternTime(timestamp) {
        if (!timestamp) return { date: '—', time: '—' };
        
        try {
            const date = new Date(timestamp);
            
            if (isNaN(date.getTime())) {
                return { date: '—', time: '—' };
            }
            
            const dateOptions = {
                timeZone: 'America/New_York',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            };
            
            const timeOptions = {
                timeZone: 'America/New_York',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            
            return {
                date: date.toLocaleDateString('en-US', dateOptions),
                time: date.toLocaleTimeString('en-US', timeOptions)
            };
        } catch (error) {
            console.error('Date formatting error:', error);
            return { date: '—', time: '—' };
        }
    }
