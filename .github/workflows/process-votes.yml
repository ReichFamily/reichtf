name: Build Page and Process Votes
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  build-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      # STEP 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # STEP 2: Build your website/page (ADD YOUR BUILD COMMANDS HERE)
      - name: Build Page
        run: |
          echo "=== BUILDING WEBSITE/PAGE ==="
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          
          # ============================================
          # ADD YOUR BUILD COMMANDS HERE
          # For example:
          # - npm install
          # - npm run build
          # - Copy HTML/CSS/JS files to the right location
          # ============================================
          
          # Example: Create a simple index.html if none exists
          if [ ! -f "index.html" ]; then
            echo "Creating simple index.html..."
            cat > index.html << EOF
<!DOCTYPE html>
<html>
<head>
    <title>Voting System</title>
</head>
<body>
    <h1>Voting System</h1>
    <p>Vote results are processed automatically.</p>
</body>
</html>
EOF
          fi
          
          echo "Build completed at: $(date)"
          
      # STEP 3: Process votes (with dynamic directory detection)
      - name: Process Votes
        run: |
          echo "=== STARTING VOTE PROCESSING ==="
          echo "Starting at: $(date)"
          
          # Find all vote files and group them by directory
          echo "Looking for vote files in votes/**/vote_*.json..."
          declare -A vote_dirs
          
          # Collect all vote files and group by directory
          for vote_file in votes/**/vote_*.json; do
            if [ -f "$vote_file" ]; then
              dir=$(dirname "$vote_file")
              vote_dirs["$dir"]=1
              echo "Found vote file: $vote_file (dir: $dir)"
            fi
          done
          
          # If no vote files found with pattern, use find command
          if [ ${#vote_dirs[@]} -eq 0 ]; then
            echo "No vote files found with pattern, searching with find..."
            while IFS= read -r vote_file; do
              if [ -f "$vote_file" ]; then
                dir=$(dirname "$vote_file")
                vote_dirs["$dir"]=1
                echo "Found vote file: $vote_file (dir: $dir)"
              fi
            done < <(find votes/ -name "vote_*.json" -type f 2>/dev/null || true)
          fi
          
          if [ ${#vote_dirs[@]} -eq 0 ]; then
            echo "No vote files to process."
            echo "=== VOTE PROCESSING COMPLETE (nothing to do) ==="
            exit 0
          fi
          
          echo "Found ${#vote_dirs[@]} directory(ies) with vote files."
          
          # Process each directory that has vote files
          for DIR in "${!vote_dirs[@]}"; do
            echo ""
            echo "=========================================="
            echo "PROCESSING DIRECTORY: $DIR"
            echo "=========================================="
            
            if [ ! -d "$DIR" ]; then
              echo "ERROR: Directory not found: $DIR"
              continue
            fi
            
            results_file="$DIR/results.json"
            echo "Results file: $results_file"
            
            # LOAD EXISTING RESULTS AND COMMENTS
            if [ -f "$results_file" ]; then
              echo "Loading existing results..."
              yes_votes=$(jq -r '.yes // 0' "$results_file" 2>/dev/null || echo "0")
              no_votes=$(jq -r '.no // 0' "$results_file" 2>/dev/null || echo "0")
              yes_comments_existing=$(jq -c '.yesComments // []' "$results_file" 2>/dev/null || echo "[]")
              no_comments_existing=$(jq -c '.noComments // []' "$results_file" 2>/dev/null || echo "[]")
              existing_candidate=$(jq -r '.candidate // ""' "$results_file" 2>/dev/null || echo "")
              existing_election=$(jq -r '.election // ""' "$results_file" 2>/dev/null || echo "")
              echo "Existing results: $yes_votes YES, $no_votes NO"
            else
              echo "No existing results file, starting fresh."
              yes_votes=0
              no_votes=0
              yes_comments_existing="[]"
              no_comments_existing="[]"
              existing_candidate=""
              existing_election=""
            fi
            
            # Arrays for NEW comments
            yes_comments_new=()
            no_comments_new=()
            new_yes=0
            new_no=0
            processed_count=0
            
            echo "Processing vote files in $DIR..."
            
            # Process all vote_*.json files in this directory
            for vote_file in "$DIR"/vote_*.json; do
              if [ -f "$vote_file" ]; then
                processed_count=$((processed_count + 1))
                echo "  Processing vote file #$processed_count: $(basename "$vote_file")"
                
                # Extract data from vote file
                vote=$(jq -r '.vote // ""' "$vote_file" 2>/dev/null || echo "")
                notes=$(jq -r '.notes // ""' "$vote_file" 2>/dev/null || echo "")
                email=$(jq -r '.email // ""' "$vote_file" 2>/dev/null || echo "")
                timestamp=$(jq -r '.timestamp // ""' "$vote_file" 2>/dev/null || echo "")
                
                # Try to extract election and candidate from vote file if not already set
                if [ -z "$existing_election" ] || [ -z "$existing_candidate" ]; then
                  vote_election=$(jq -r '.election // ""' "$vote_file" 2>/dev/null || echo "")
                  vote_candidate=$(jq -r '.candidate // ""' "$vote_file" 2>/dev/null || echo "")
                  
                  if [ -n "$vote_election" ] && [ "$vote_election" != "null" ] && [ -z "$existing_election" ]; then
                    existing_election="$vote_election"
                    echo "    Found election in vote file: $existing_election"
                  fi
                  
                  if [ -n "$vote_candidate" ] && [ "$vote_candidate" != "null" ] && [ -z "$existing_candidate" ]; then
                    existing_candidate="$vote_candidate"
                    echo "    Found candidate in vote file: $existing_candidate"
                  fi
                fi
                
                # Count vote
                if [ "$vote" = "yes" ]; then
                  new_yes=$((new_yes + 1))
                  yes_votes=$((yes_votes + 1))
                  echo "    ✓ YES vote"
                elif [ "$vote" = "no" ]; then
                  new_no=$((new_no + 1))
                  no_votes=$((no_votes + 1))
                  echo "    ✓ NO vote"
                else
                  echo "    ⚠️  Invalid or missing vote value: '$vote'"
                fi
                
                # Collect NEW comment (filter out placeholder)
                if [ -n "$notes" ] && [ "$notes" != "null" ] && [ "$notes" != "" ]; then
                  DEFAULT_PLACEHOLDER="Please provide any comments about your vote. These will be visible with the results."
                  if [ "$notes" != "$DEFAULT_PLACEHOLDER" ]; then
                    comment_obj=$(jq -n \
                      --arg notes "$notes" \
                      --arg email "$email" \
                      --arg timestamp "$timestamp" \
                      '{notes: $notes, email: $email, timestamp: $timestamp}')
                    
                    if [ "$vote" = "yes" ]; then
                      yes_comments_new+=("$comment_obj")
                      echo "    💬 New YES comment"
                    elif [ "$vote" = "no" ]; then
                      no_comments_new+=("$comment_obj")
                      echo "    💬 New NO comment"
                    fi
                  fi
                fi
                
                # Remove processed vote file
                rm "$vote_file"
                echo "    🗑️  Removed processed vote file"
              fi
            done
            
            if [ $processed_count -eq 0 ]; then
              echo "No vote files found in $DIR"
              continue
            fi
            
            echo "New votes in $DIR: $new_yes YES, $new_no NO"
            echo "Total votes: $yes_votes YES, $no_votes NO"
            
            # Calculate percentages
            total_votes=$((yes_votes + no_votes))
            if [ $total_votes -gt 0 ]; then
              yes_percent=$(echo "scale=1; $yes_votes * 100 / $total_votes" | bc)
              no_percent=$(echo "scale=1; $no_votes * 100 / $total_votes" | bc)
            else
              yes_percent=0
              no_percent=0
            fi
            
            echo "Percentages: YES $yes_percent%, NO $no_percent%"
            
            # MERGE OLD + NEW COMMENTS
            echo "Combining comments..."
            if [ ${#yes_comments_new[@]} -gt 0 ]; then
              yes_comments_new_json=$(printf '%s\n' "${yes_comments_new[@]}" | jq -s '.')
              yes_comments_final=$(jq -c --argjson old "$yes_comments_existing" --argjson new "$yes_comments_new_json" '$old + $new' <<< '[]')
            else
              yes_comments_final="$yes_comments_existing"
            fi
            
            if [ ${#no_comments_new[@]} -gt 0 ]; then
              no_comments_new_json=$(printf '%s\n' "${no_comments_new[@]}" | jq -s '.')
              no_comments_final=$(jq -c --argjson old "$no_comments_existing" --argjson new "$no_comments_new_json" '$old + $new' <<< '[]')
            else
              no_comments_final="$no_comments_existing"
            fi
            
            echo "Total comments: YES=$(echo "$yes_comments_final" | jq 'length' 2>/dev/null || echo "0"), NO=$(echo "$no_comments_final" | jq 'length' 2>/dev/null || echo "0")"
            
            # If election and candidate weren't found, extract from directory path
            if [ -z "$existing_election" ] || [ -z "$existing_candidate" ]; then
              echo "Extracting election/candidate from directory path..."
              # Remove 'votes/' prefix if present
              relative_dir="${DIR#votes/}"
              if [ "$relative_dir" != "$DIR" ]; then
                # Split by '/'
                IFS='/' read -ra parts <<< "$relative_dir"
                if [ ${#parts[@]} -ge 2 ]; then
                  if [ -z "$existing_election" ]; then
                    existing_election="${parts[0]}"
                    echo "  Extracted election from path: $existing_election"
                  fi
                  if [ -z "$existing_candidate" ]; then
                    existing_candidate="${parts[1]}"
                    echo "  Extracted candidate from path: $existing_candidate"
                  fi
                fi
              fi
            fi
            
            # Set defaults if still empty
            if [ -z "$existing_election" ]; then
              existing_election="unknown-election"
            fi
            if [ -z "$existing_candidate" ]; then
              existing_candidate="unknown-candidate"
            fi
            
            # WRITE FINAL RESULTS WITH ALL COMMENTS
            echo "Writing results to $results_file..."
            jq -n \
              --arg candidate "$existing_candidate" \
              --arg election "$existing_election" \
              --argjson yes "$yes_votes" \
              --argjson no "$no_votes" \
              --argjson total "$total_votes" \
              --arg yesPercent "$yes_percent" \
              --arg noPercent "$no_percent" \
              --argjson yesComments "$yes_comments_final" \
              --argjson noComments "$no_comments_final" \
              --arg lastUpdated "$(date -Iseconds)Z" \
              '{
                candidate: $candidate,
                election: $election,
                yes: $yes,
                no: $no,
                total: $total,
                yesPercent: ($yesPercent | tonumber),
                noPercent: ($noPercent | tonumber),
                yesComments: $yesComments,
                noComments: $noComments,
                lastUpdated: $lastUpdated
              }' > "$results_file"
            
            if [ $? -eq 0 ]; then
              echo "✅ Successfully wrote results for $existing_candidate"
              echo "   Final: $yes_votes YES, $no_votes NO"
            else
              echo "❌ Failed to write results file"
            fi
            
            echo "Completed processing $DIR"
          done
          
          echo ""
          echo "=== VOTE PROCESSING COMPLETE ==="
          echo "Processed ${#vote_dirs[@]} directory(ies)"
          echo "Finished at: $(date)"
          
      # STEP 4: Commit and push all changes
      - name: Commit and push changes
        run: |
          echo "=== COMMITTING CHANGES ==="
          echo "Current time: $(date)"
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Check what changes exist
          echo "Checking for changes..."
          git status
          
          # Add all changes
          git add -A
          
          # Check if there are any changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            echo "Changes detected, committing..."
            git commit -m "Build page and update vote results - $(date '+%Y-%m-%d %H:%M:%S')"
            
            # Pull latest changes and push
            echo "Pulling latest changes..."
            git pull origin main --rebase --autostash
            
            echo "Pushing changes..."
            git push origin main
            
            echo "✅ Changes committed and pushed successfully."
          fi
          
      # STEP 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        run: |
          echo "=== DEPLOYING TO GITHUB PAGES ==="
          echo "Deployment started at: $(date)"
          
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./  # CHANGE THIS to your actual build directory if different
          # If your built files go to a 'dist' folder, use: publish_dir: ./dist
          # If your built files go to a 'build' folder, use: publish_dir: ./build
          # If your site is just in the root, use: publish_dir: ./
          force_orphan: true
          keep_files: false
