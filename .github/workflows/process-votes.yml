name: Process Votes
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count votes and update results
        run: |
          set -e
          echo "Starting vote processing..."
          
          # Process all election/candidate folders
          for election_dir in votes/*/; do
            election=$(basename "$election_dir")
            echo "Election: $election"
            
            for candidate_dir in "$election_dir"*/; do
              candidate=$(basename "$candidate_dir")
              echo "  Candidate: $candidate"
              
              results_file="$candidate_dir/results.json"
              
              # Initialize or read existing results
              if [ -f "$results_file" ]; then
                yes_votes=$(jq -r '.yes // 0' "$results_file")
                no_votes=$(jq -r '.no // 0' "$results_file")
                echo "    Existing: $yes_votes YES, $no_votes NO"
              else
                yes_votes=0
                no_votes=0
                echo "    No existing results"
              fi
              
              # Count new votes
              new_yes=0
              new_no=0
              for vote_file in "$candidate_dir"vote_*.json; do
                if [ -f "$vote_file" ]; then
                  vote=$(jq -r '.vote' "$vote_file" 2>/dev/null || echo "")
                  if [ "$vote" = "yes" ]; then
                    ((new_yes++))
                    ((yes_votes++))
                    echo "    ✓ YES vote"
                  elif [ "$vote" = "no" ]; then
                    ((new_no++))
                    ((no_votes++))
                    echo "    ✓ NO vote"
                  else
                    echo "    ✗ Invalid vote format"
                  fi
                  rm "$vote_file"
                fi
              done
              
              echo "    New votes: $new_yes YES, $new_no NO"
              
              # Calculate percentages
              total_votes=$((yes_votes + no_votes))
              if [ $total_votes -gt 0 ]; then
                yes_percent=$(echo "scale=1; $yes_votes * 100 / $total_votes" | bc)
                no_percent=$(echo "scale=1; $no_votes * 100 / $total_votes" | bc)
              else
                yes_percent=0
                no_percent=0
              fi
              
              # Write results
              jq -n \
                --arg candidate "$candidate" \
                --arg election "$election" \
                --argjson yes "$yes_votes" \
                --argjson no "$no_votes" \
                --argjson total "$total_votes" \
                --arg yesPercent "$yes_percent" \
                --arg noPercent "$no_percent" \
                --arg lastUpdated "$(date -Iseconds)Z" \
                '{
                  candidate: $candidate,
                  election: $election,
                  yes: $yes,
                  no: $no,
                  total: $total,
                  yesPercent: ($yesPercent | tonumber),
                  noPercent: ($noPercent | tonumber),
                  lastUpdated: $lastUpdated
                }' > "$results_file"
              
              echo "    Final: $yes_votes YES, $no_votes NO"
              echo ""
            done
          done
          
          echo "Vote processing complete"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
          keep_files: false
