name: Process Votes
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count votes and update results
        run: |
          echo "Starting vote processing..."
          
          DIR="votes/membership-2026/emma-cambridge"
          echo "Processing directory: $DIR"
          
          if [ ! -d "$DIR" ]; then
            echo "ERROR: Directory not found"
            exit 1
          fi
          
          results_file="$DIR/results.json"
          
          if [ -f "$results_file" ]; then
            yes_votes=$(jq -r '.yes // 0' "$results_file")
            no_votes=$(jq -r '.no // 0' "$results_file")
            echo "Existing: $yes_votes YES, $no_votes NO"
          else
            yes_votes=0
            no_votes=0
          fi
          
          for vote_file in "$DIR"/vote_*.json; do
            if [ -f "$vote_file" ]; then
              echo "=== DEBUG START ==="
              echo "File: $(basename "$vote_file")"
              echo "Content:"
              cat "$vote_file"
              echo ""
              
              vote=$(jq -r '.vote' "$vote_file")
              echo "Extracted vote: '$vote'"
              
              if [ "$vote" = "yes" ]; then
                yes_votes=$((yes_votes + 1))
                new_yes=$((new_yes + 1))
                echo "Counted as YES"
              elif [ "$vote" = "no" ]; then
                no_votes=$((no_votes + 1))
                new_no=$((new_no + 1))
                echo "Counted as NO"
              else
                echo "ERROR: Invalid vote value"
              fi
              
              rm "$vote_file"
              echo "File deleted"
              echo "=== DEBUG END ==="
            fi
          done
          
          echo "New votes: $new_yes YES, $new_no NO"
          
          total_votes=$((yes_votes + no_votes))
          if [ $total_votes -gt 0 ]; then
            yes_percent=$(echo "scale=1; $yes_votes * 100 / $total_votes" | bc)
            no_percent=$(echo "scale=1; $no_votes * 100 / $total_votes" | bc)
          else
            yes_percent=0
            no_percent=0
          fi
          
          jq -n \
            --arg candidate "emma-cambridge" \
            --arg election "membership-2026" \
            --argjson yes "$yes_votes" \
            --argjson no "$no_votes" \
            --argjson total "$total_votes" \
            --arg yesPercent "$yes_percent" \
            --arg noPercent "$no_percent" \
            --arg lastUpdated "$(date -Iseconds)Z" \
            '{
              candidate: $candidate,
              election: $election,
              yes: $yes,
              no: $no,
              total: $total,
              yesPercent: ($yesPercent | tonumber),
              noPercent: ($noPercent | tonumber),
              lastUpdated: $lastUpdated
            }' > "$results_file"
          
          echo "Final: $yes_votes YES, $no_votes NO"
          echo "Vote processing complete"

      - name: Commit results to main branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update vote results"
            git pull origin main --rebase --autostash
            git push origin main
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
          force_orphan: true
          keep_files: false
