      - name: Count votes and update results
        run: |
          echo "Counting votes..."
          
          # Process each candidate folder
          find votes -type f -name "*.json" ! -name "results.json" | while read vote_file; do
            folder=$(dirname "$vote_file")
            candidate=$(basename "$folder")
            election=$(basename $(dirname "$folder"))
            
            # Initialize or read existing results
            results_file="$folder/results.json"
            if [ -f "$results_file" ]; then
              yes=$(jq -r '.yes // 0' "$results_file")
              no=$(jq -r '.no // 0' "$results_file")
            else
              yes=0
              no=0
            fi
            
            # Count this vote
            vote=$(jq -r '.vote' "$vote_file")
            if [ "$vote" = "yes" ]; then
              yes=$((yes + 1))
            elif [ "$vote" = "no" ]; then
              no=$((no + 1))
            fi
            
            # Delete processed vote file
            rm "$vote_file"
            
            # Calculate percentages
            total=$((yes + no))
            if [ $total -gt 0 ]; then
              yes_pct=$(echo "scale=1; $yes * 100 / $total" | bc)
              no_pct=$(echo "scale=1; $no * 100 / $total" | bc)
            else
              yes_pct=0
              no_pct=0
            fi
            
            # Create/update results.json
            jq -n \
              --arg cand "$candidate" \
              --arg elec "$election" \
              --argjson y "$yes" \
              --argjson n "$no" \
              --argjson t "$total" \
              --argjson yp "$yes_pct" \
              --argjson np "$no_pct" \
              --arg updated "$(date -Iseconds)Z" \
              '{
                candidate: $cand,
                election: $elec,
                yes: $y,
                no: $n,
                total: $t,
                yesPercent: $yp,
                noPercent: $np,
                lastUpdated: $updated
              }' > "$results_file"
            
            echo "Updated $election/$candidate: YES=$yes NO=$no"
          done
