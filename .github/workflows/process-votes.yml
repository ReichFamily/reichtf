name: Process All Votes
on:
  push:
    paths:
      - 'votes/**/*.json'
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Process ALL vote directories
        run: |
          echo "=== Universal Vote Processor ==="
          
          # Find ALL directories containing vote files
          find votes -type f -name "vote_*.json" 2>/dev/null | while read VOTE_FILE; do
            DIR=$(dirname "$VOTE_FILE")
            echo "📁 Processing: $DIR"
            
            # Process this directory
            process_directory "$DIR"
          done
          
          echo "✅ All directories processed"
        
        env:
          # Function to process a single directory
          process_directory: |
            function process_directory {
              local DIR="$1"
              
              # Skip if no vote files
              if [ ! -f "$DIR"/*vote_*.json ] 2>/dev/null; then
                return
              fi
              
              # Load existing results
              local RESULTS_FILE="$DIR/results.json"
              if [ -f "$RESULTS_FILE" ]; then
                local YES=$(jq -r '.yes // 0' "$RESULTS_FILE")
                local NO=$(jq -r '.no // 0' "$RESULTS_FILE")
                local YES_COMMENTS=$(jq -c '.yesComments // []' "$RESULTS_FILE")
                local NO_COMMENTS=$(jq -c '.noComments // []' "$RESULTS_FILE")
              else
                local YES=0
                local NO=0
                local YES_COMMENTS="[]"
                local NO_COMMENTS="[]"
              fi
              
              # Process new votes
              for VOTE_FILE in "$DIR"/vote_*.json; do
                [ -f "$VOTE_FILE" ] || continue
                
                local VOTE=$(jq -r '.vote' "$VOTE_FILE")
                local NOTES=$(jq -r '.notes // ""' "$VOTE_FILE")
                
                # Skip placeholder comments
                if [[ "$NOTES" == "Please provide any comments about your vote. These will be visible with the results." ]]; then
                  NOTES=""
                fi
                
                if [[ "$VOTE" == "yes" ]]; then
                  YES=$((YES + 1))
                  if [ -n "$NOTES" ] && [ "$NOTES" != "null" ] && [ "$NOTES" != "" ]; then
                    local COMMENT=$(jq -n --arg n "$NOTES" --arg t "$(jq -r '.timestamp' "$VOTE_FILE")" '{notes: $n, timestamp: $t}')
                    YES_COMMENTS=$(echo "$YES_COMMENTS" | jq --argjson c "$COMMENT" '. + [$c]')
                  fi
                elif [[ "$VOTE" == "no" ]]; then
                  NO=$((NO + 1))
                  if [ -n "$NOTES" ] && [ "$NOTES" != "null" ] && [ "$NOTES" != "" ]; then
                    local COMMENT=$(jq -n --arg n "$NOTES" --arg t "$(jq -r '.timestamp' "$VOTE_FILE")" '{notes: $n, timestamp: $t}')
                    NO_COMMENTS=$(echo "$NO_COMMENTS" | jq --argjson c "$COMMENT" '. + [$c]')
                  fi
                fi
                
                # Archive
                mkdir -p "$DIR/archive"
                mv "$VOTE_FILE" "$DIR/archive/"
              done
              
              # Calculate totals
              local TOTAL=$((YES + NO))
              if [ $TOTAL -gt 0 ]; then
                local YES_PCT=$(echo "scale=1; $YES * 100 / $TOTAL" | bc)
                local NO_PCT=$(echo "scale=1; $NO * 100 / $TOTAL" | bc)
              else
                local YES_PCT=0
                local NO_PCT=0
              fi
              
              # Get directory names
              local ELECTION=$(basename $(dirname "$DIR"))
              local CANDIDATE=$(basename "$DIR")
              
              # Save results
              jq -n \
                --arg e "$ELECTION" \
                --arg c "$CANDIDATE" \
                --argjson y "$YES" \
                --argjson n "$NO" \
                --argjson t "$TOTAL" \
                --arg yp "$YES_PCT" \
                --arg np "$NO_PCT" \
                --argjson yc "$YES_COMMENTS" \
                --argjson nc "$NO_COMMENTS" \
                --arg lu "$(date -Iseconds)Z" \
                '{
                  electionId: $e,
                  candidateId: $c,
                  yes: $y,
                  no: $n,
                  total: $t,
                  yesPercent: ($yp | tonumber),
                  noPercent: ($np | tonumber),
                  yesComments: $yc,
                  noComments: $nc,
                  lastUpdated: $lu
                }' > "$RESULTS_FILE"
              
              echo "  ✅ $DIR: $YES YES, $NO NO"
            }

      - name: Commit results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update vote results"
            git push
          fi
