name: Process Votes
on:
  push:
    paths:
      - 'votes/**/*.json'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process votes from all directories
        run: |
          echo "=== STARTING VOTE PROCESSING ==="
          
          # Find all directories with vote files
          find votes -type f -name "vote_*.json" | while read vote_file; do
            dir=$(dirname "$vote_file")
            echo "Processing votes in: $dir"
            
            # Your original vote processing script goes here
            # ... copy your existing script that processes a single directory
            
          done
          
          echo "=== PROCESSING COMPLETE ==="

      - name: Commit results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update vote results"
            git pull origin main --rebase --autostash
            git push origin main
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
          force_orphan: true
          keep_files: false
