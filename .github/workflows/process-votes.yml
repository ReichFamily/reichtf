name: Process Votes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'votes/**'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Count votes and update results
        run: |
          echo "Starting vote count..."

          # Find all candidate folders
          find votes -type f -name "*.json" | grep -v "results.json" | while read vote_file; do
            folder=$(dirname "$vote_file")
            candidate=$(basename "$folder")
            election=$(basename $(dirname "$folder"))

            # Initialize or read existing results
            results_file="$folder/results.json"
            if [ -f "$results_file" ]; then
              yes_votes=$(jq -r '.yes // 0' "$results_file")
              no_votes=$(jq -r '.no // 0' "$results_file")
              notes=$(jq -r '.notes // []' "$results_file")
            else
              yes_votes=0
              no_votes=0
              notes="[]"
            fi

            # Process this vote file
            vote=$(jq -r '.vote' "$vote_file")
            email=$(jq -r '.email' "$vote_file")
            note=$(jq -r '.notes' "$vote_file")

            if [ "$vote" = "yes" ]; then
              yes_votes=$((yes_votes + 1))
            elif [ "$vote" = "no" ]; then
              no_votes=$((no_votes + 1))
            fi

            # Add note if it exists and isn't empty
            if [ "$note" != "null" ] && [ "$note" != "" ]; then
              new_note="{\"vote\": \"$vote\", \"text\": \"$note\", \"email\": \"${email:0:3}***${email#*@}\", \"time\": \"$(date -Iseconds)\"}"
              notes=$(echo "$notes" | jq --argjson new "$new_note" '. + [$new]')
            fi

            # Delete the processed vote file
            rm "$vote_file"

            # Calculate totals
            total=$((yes_votes + no_votes))
            if [ $total -gt 0 ]; then
              yes_percent=$(echo "scale=1; $yes_votes * 100 / $total" | bc)
              no_percent=$(echo "scale=1; $no_votes * 100 / $total" | bc)
            else
              yes_percent=0
              no_percent=0
            fi

            # Create new results.json
            jq -n \
              --arg candidate "$candidate" \
              --arg election "$election" \
              --argjson yes "$yes_votes" \
              --argjson no "$no_votes" \
              --argjson total "$total" \
              --argjson yesPercent "$yes_percent" \
              --argjson noPercent "$no_percent" \
              --argjson notes "$notes" \
              --arg lastUpdated "$(date -Iseconds)Z" \
              '{
                candidate: $candidate,
                election: $election,
                yes: $yes,
                no: $no,
                total: $total,
                yesPercent: $yesPercent,
                noPercent: $noPercent,
                notes: $notes,
                lastUpdated: $lastUpdated
              }' > "$results_file"

            echo "Updated: $election/$candidate - YES: $yes_votes, NO: $no_votes"
          done

          echo "Vote counting complete."

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/*/*/results.json
          git add -u  # Remove deleted vote files

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update voting results"
            git push
          fi
