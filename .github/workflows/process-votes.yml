name: Process Votes
on:
  # 🔥 NEW: Triggers IMMEDIATELY when a vote file is saved
  push:
    paths:
      - 'votes/**/*.json'
  # Keep manual trigger for testing
  workflow_dispatch:
  # Optional: Keep schedule as a safety net (change to every 5 min)
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count votes and update results WITH COMMENTS
        run: |
          echo "=== STARTING VOTE PROCESSING WITH COMMENTS ==="
          
          DIR="votes/membership-2026/emma-cambridge"
          echo "Processing: $DIR"
          
          if [ ! -d "$DIR" ]; then
            echo "ERROR: Directory not found"
            exit 1
          fi
          
          results_file="$DIR/results.json"
          
          # Read existing results
          if [ -f "$results_file" ]; then
            yes_votes=$(jq -r '.yes // 0' "$results_file")
            no_votes=$(jq -r '.no // 0' "$results_file")
            echo "Existing: $yes_votes YES, $no_votes NO"
          else
            yes_votes=0
            no_votes=0
          fi
          
          # Arrays to collect comments
          yes_comments=()
          no_comments=()
          new_yes=0
          new_no=0
          
          echo "=== PROCESSING VOTE FILES ==="
          # Single pass: count votes AND collect comments
          for vote_file in "$DIR"/vote_*.json; do
            if [ -f "$vote_file" ]; then
              echo "Processing: $(basename "$vote_file")"
              
              # Extract all data
              vote=$(jq -r '.vote' "$vote_file" 2>/dev/null || echo "")
              notes=$(jq -r '.notes // ""' "$vote_file" 2>/dev/null || echo "")
              email=$(jq -r '.email // ""' "$vote_file" 2>/dev/null || echo "")
              timestamp=$(jq -r '.timestamp // ""' "$vote_file" 2>/dev/null || echo "")
              
              # Count the vote
              if [ "$vote" = "yes" ]; then
                new_yes=$((new_yes + 1))
                yes_votes=$((yes_votes + 1))
                echo "  ✓ YES vote"
              elif [ "$vote" = "no" ]; then
                new_no=$((new_no + 1))
                no_votes=$((no_votes + 1))
                echo "  ✓ NO vote"
              else
                echo "  ✗ INVALID vote value"
              fi
              
              # Collect comment if it exists
              if [ -n "$notes" ] && [ "$notes" != "null" ] && [ "$notes" != "" ]; then
                comment_obj=$(jq -n \
                  --arg notes "$notes" \
                  --arg email "$email" \
                  --arg timestamp "$timestamp" \
                  '{notes: $notes, email: $email, timestamp: $timestamp}')
                
                if [ "$vote" = "yes" ]; then
                  yes_comments+=("$comment_obj")
                  echo "  💬 Has YES comment"
                elif [ "$vote" = "no" ]; then
                  no_comments+=("$comment_obj")
                  echo "  💬 Has NO comment"
                fi
              fi
              
              # Delete the processed file
              rm "$vote_file"
            fi
          done
          
          echo "New votes processed: $new_yes YES, $new_no NO"
          
          # Calculate percentages
          total_votes=$((yes_votes + no_votes))
          if [ $total_votes -gt 0 ]; then
            yes_percent=$(echo "scale=1; $yes_votes * 100 / $total_votes" | bc)
            no_percent=$(echo "scale=1; $no_votes * 100 / $total_votes" | bc)
          else
            yes_percent=0
            no_percent=0
          fi
          
          # Convert comment arrays to JSON
          yes_comments_json=$(printf '%s\n' "${yes_comments[@]}" | jq -s '.')
          no_comments_json=$(printf '%s\n' "${no_comments[@]}" | jq -s '.')
          
          echo "Comments collected: YES=${#yes_comments[@]}, NO=${#no_comments[@]}"
          
          # Write results.json WITH comments
          echo "=== WRITING RESULTS.JSON ==="
          jq -n \
            --arg candidate "emma-cambridge" \
            --arg election "membership-2026" \
            --argjson yes "$yes_votes" \
            --argjson no "$no_votes" \
            --argjson total "$total_votes" \
            --arg yesPercent "$yes_percent" \
            --arg noPercent "$no_percent" \
            --argjson yesComments "$yes_comments_json" \
            --argjson noComments "$no_comments_json" \
            --arg lastUpdated "$(date -Iseconds)Z" \
            '{
              candidate: $candidate,
              election: $election,
              yes: $yes,
              no: $no,
              total: $total,
              yesPercent: ($yesPercent | tonumber),
              noPercent: ($noPercent | tonumber),
              yesComments: $yesComments,
              noComments: $noComments,
              lastUpdated: $lastUpdated
            }' > "$results_file"
          
          echo "Final: $yes_votes YES, $no_votes NO"
          echo "=== PROCESSING COMPLETE ==="

      - name: Commit results to main branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update vote results"
            git pull origin main --rebase --autostash
            git push origin main
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
          force_orphan: true
          keep_files: false
