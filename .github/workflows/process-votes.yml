name: Process Votes
on:
  push:
    branches: [data]  # ← CRITICAL: Trigger on DATA branch, not main
    paths:
      - 'votes/**/*.json'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # 1. Checkout the DATA branch (where votes go)
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data  # ← CHECKOUT data branch
          fetch-depth: 0

      # 2. Process votes (your existing script)
      - name: Process votes from all directories
        run: |
          echo "=== STARTING VOTE PROCESSING ==="
          
          # Find ALL vote files and process each directory
          find votes -type f -name "vote_*.json" | while read VOTE_FILE; do
            DIR=$(dirname "$VOTE_FILE")
            RESULTS_FILE="$DIR/results.json"
            
            echo "Processing: $DIR"
            
            # Load existing results or start fresh
            if [ -f "$RESULTS_FILE" ]; then
              yes_votes=$(jq -r '.yes // 0' "$RESULTS_FILE")
              no_votes=$(jq -r '.no // 0' "$RESULTS_FILE")
              yes_comments=$(jq -c '.yesComments // []' "$RESULTS_FILE")
              no_comments=$(jq -c '.noComments // []' "$RESULTS_FILE")
            else
              yes_votes=0
              no_votes=0
              yes_comments="[]"
              no_comments="[]"
            fi
            
            # Process ALL vote files in this directory
            for vote_file in "$DIR"/vote_*.json; do
              if [ -f "$vote_file" ]; then
                echo "  Found vote: $(basename "$vote_file")"
                
                # Get vote data
                vote=$(jq -r '.vote // ""' "$vote_file")
                notes=$(jq -r '.notes // ""' "$vote_file")
                email=$(jq -r '.email // ""' "$vote_file")
                timestamp=$(jq -r '.timestamp // ""' "$vote_file")
                
                # Count vote
                if [ "$vote" = "yes" ]; then
                  yes_votes=$((yes_votes + 1))
                elif [ "$vote" = "no" ]; then
                  no_votes=$((no_votes + 1))
                fi
                
                # Add comment if present (not placeholder)
                if [ -n "$notes" ] && [ "$notes" != "null" ] && [ "$notes" != "" ]; then
                  if [ "$notes" != "Please provide any comments about your vote. These will be visible with the results." ]; then
                    comment=$(jq -n --arg n "$notes" --arg e "$email" --arg t "$timestamp" \
                      '{notes: $n, email: $e, timestamp: $t}')
                    
                    if [ "$vote" = "yes" ]; then
                      yes_comments=$(echo "$yes_comments" | jq --argjson c "$comment" '. + [$c]')
                    elif [ "$vote" = "no" ]; then
                      no_comments=$(echo "$no_comments" | jq --argjson c "$comment" '. + [$c]')
                    fi
                  fi
                fi
                
                # Remove processed file
                rm "$vote_file"
              fi
            done
            
            # Calculate totals
            total=$((yes_votes + no_votes))
            if [ $total -gt 0 ]; then
              yes_percent=$(echo "scale=1; $yes_votes * 100 / $total" | bc)
              no_percent=$(echo "scale=1; $no_votes * 100 / $total" | bc)
            else
              yes_percent=0
              no_percent=0
            fi
            
            # Extract election and candidate from path
            ELECTION=$(echo "$DIR" | cut -d'/' -f2)
            CANDIDATE=$(echo "$DIR" | cut -d'/' -f3)
            
            # Write results
            jq -n \
              --arg e "$ELECTION" \
              --arg c "$CANDIDATE" \
              --argjson y "$yes_votes" \
              --argjson n "$no_votes" \
              --argjson t "$total" \
              --arg yp "$yes_percent" \
              --arg np "$no_percent" \
              --argjson yc "$yes_comments" \
              --argjson nc "$no_comments" \
              --arg lu "$(date -Iseconds)Z" \
              '{
                election: $e,
                candidate: $c,
                yes: $y,
                no: $n,
                total: $t,
                yesPercent: ($yp | tonumber),
                noPercent: ($np | tonumber),
                yesComments: $yc,
                noComments: $nc,
                lastUpdated: $lu
              }' > "$RESULTS_FILE"
            
            echo "  Updated: $yes_votes YES, $no_votes NO"
          done
          
          echo "=== PROCESSING COMPLETE ==="

      # 3. Commit processed results back to DATA branch
      - name: Commit and push results to data branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update vote results - $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin data
            git push origin data
          fi
      
      # 4. OPTIONAL: Copy results to main branch (if you want Pages to update)
      - name: Sync results to main branch
        if: success()
        run: |
          git checkout main
          git pull origin main
          # Copy results.json files to main
          find votes -name "results.json" -exec cp --parents {} . \;
          git add votes/
          git commit -m "Sync voting results to main" || echo "No changes to sync"
          git push origin main
