name: Process Votes
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count votes and update results
        run: |
          echo "Processing votes for membership-2026/emma-cambridge..."
          
          FOLDER="votes/membership-2026/emma-cambridge"
          RESULTS="$FOLDER/results.json"
          
          # Initialize
          yes=0
          no=0
          
          # Read existing results
          if [ -f "$RESULTS" ]; then
            yes=$(jq -r '.yes // 0' "$RESULTS")
            no=$(jq -r '.no // 0' "$RESULTS")
          fi
          
          # Count new votes
          for vote_file in "$FOLDER"/vote_*.json; do
            if [ -f "$vote_file" ]; then
              vote=$(jq -r '.vote' "$vote_file" 2>/dev/null)
              if [ "$vote" = "yes" ]; then
                yes=$((yes + 1))
              elif [ "$vote" = "no" ]; then
                no=$((no + 1))
              fi
              rm "$vote_file"
            fi
          done
          
          # Calculate
          total=$((yes + no))
          if [ $total -gt 0 ]; then
            yes_pct=$(echo "scale=1; $yes * 100 / $total" | bc)
            no_pct=$(echo "scale=1; $no * 100 / $total" | bc)
          else
            yes_pct=0
            no_pct=0
          fi
          
          # Save
          jq -n \
            --arg cand "emma-cambridge" \
            --arg elec "membership-2026" \
            --argjson y "$yes" \
            --argjson n "$no" \
            --argjson t "$total" \
            --arg yp "$yes_pct" \
            --arg np "$no_pct" \
            --arg updated "$(date -Iseconds)Z" \
            '{
              candidate: $cand,
              election: $elec,
              yes: $y,
              no: $n,
              total: $t,
              yesPercent: ($yp | tonumber),
              noPercent: ($np | tonumber),
              lastUpdated: $updated
            }' > "$RESULTS"
          
          echo "Done: $yes YES, $no NO"
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
