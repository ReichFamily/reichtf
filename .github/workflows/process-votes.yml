name: Process Votes
on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:        # Manual trigger

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Count votes and update results
        run: |
          echo "Finding vote files..."
          find votes -name "*.json" -not -name "results.json" | while read vote_file; do
            folder=$(dirname "$vote_file")
            candidate=$(basename "$folder")
            election=$(basename $(dirname "$folder"))
            
            echo "Processing: $election/$candidate"
            
            # Read existing results or initialize
            results_file="$folder/results.json"
            if [ -f "$results_file" ]; then
              yes_votes=$(jq -r '.yes // 0' "$results_file")
              no_votes=$(jq -r '.no // 0' "$results_file")
            else
              yes_votes=0
              no_votes=0
            fi
            
            # Count this vote
            vote=$(jq -r '.vote' "$vote_file")
            if [ "$vote" = "yes" ]; then
              yes_votes=$((yes_votes + 1))
            elif [ "$vote" = "no" ]; then
              no_votes=$((no_votes + 1))
            fi
            
            # Delete the processed vote file
            rm "$vote_file"
            
            # Calculate totals
            total=$((yes_votes + no_votes))
            if [ $total -gt 0 ]; then
              yes_percent=$(echo "scale=1; $yes_votes * 100 / $total" | bc)
              no_percent=$(echo "scale=1; $no_votes * 100 / $total" | bc)
            else
              yes_percent=0
              no_percent=0
            fi
            
            # Create new results.json
            jq -n \
              --arg candidate "$candidate" \
              --arg election "$election" \
              --argjson yes "$yes_votes" \
              --argjson no "$no_votes" \
              --argjson total "$total" \
              --argjson yesPercent "$yes_percent" \
              --argjson noPercent "$no_percent" \
              --arg lastUpdated "$(date -Iseconds)Z" \
              '{
                candidate: $candidate,
                election: $election,
                yes: $yes,
                no: $no,
                total: $total,
                yesPercent: $yesPercent,
                noPercent: $noPercent,
                lastUpdated: $lastUpdated
              }' > "$results_file"
            
            echo "  Updated: YES=$yes_votes, NO=$no_votes"
          done
          
          echo "Processing complete."
      
      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/*/*/results.json
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update voting results"
            git push
          fi
