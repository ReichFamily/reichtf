name: Process Votes
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count votes and update results
        run: |
          echo "🔍 Looking for vote files..."
          
          # Find ALL directories under votes/
          find votes -type d | while read folder; do
            # Skip root votes folder
            if [ "$folder" = "votes" ]; then
              continue
            fi
            
            # Check if this is a candidate folder (has election/candidate structure)
            if [[ "$folder" =~ votes/([^/]+)/([^/]+)$ ]]; then
              election="${BASH_REMATCH[1]}"
              candidate="${BASH_REMATCH[2]}"
            else
              continue
            fi
            
            echo "📊 Processing: $election/$candidate"
            echo "   Folder path: $folder"
            
            results_file="$folder/results.json"
            if [ -f "$results_file" ]; then
              yes_votes=$(jq -r '.yes // 0' "$results_file")
              no_votes=$(jq -r '.no // 0' "$results_file")
              echo "   Existing results: $yes_votes YES, $no_votes NO"
            else
              yes_votes=0
              no_votes=0
              echo "   No existing results"
            fi
            
            # Process new vote files (excluding results.json)
            echo "   Looking for vote files..."
            vote_files=$(find "$folder" -maxdepth 1 -name "*.json" -not -name "results.json")
            echo "   Found files: $vote_files"
            
            if [ -z "$vote_files" ]; then
              echo "   No new votes to process"
              continue
            fi
            
            new_yes=0
            new_no=0
            while IFS= read -r vote_file; do
              echo "   Processing: $(basename "$vote_file")"
              
              vote=$(jq -r '.vote' "$vote_file" 2>/dev/null || echo "ERROR")
              echo "   Vote value: $vote"
              
              if [ "$vote" = "yes" ]; then
                new_yes=$((new_yes + 1))
                yes_votes=$((yes_votes + 1))
                echo "   ✓ Counting as YES"
              elif [ "$vote" = "no" ]; then
                new_no=$((new_no + 1))
                no_votes=$((no_votes + 1))
                echo "   ✓ Counting as NO"
              else
                echo "   ✗ INVALID VOTE FORMAT"
              fi
              
              # Remove processed file
              rm "$vote_file"
              echo "   ✓ File removed"
              
            done <<< "$vote_files"
            
            # Calculate totals
            total_votes=$((yes_votes + no_votes))
            if [ $total_votes -gt 0 ]; then
              yes_percent=$(echo "scale=1; $yes_votes * 100 / $total_votes" | bc)
              no_percent=$(echo "scale=1; $no_votes * 100 / $total_votes" | bc)
            else
              yes_percent=0
              no_percent=0
            fi
            
            # Create results.json
            jq -n \
              --arg candidate "$candidate" \
              --arg election "$election" \
              --argjson yes "$yes_votes" \
              --argjson no "$no_votes" \
              --argjson total "$total_votes" \
              --arg yesPercent "$yes_percent" \
              --arg noPercent "$no_percent" \
              --arg lastUpdated "$(date -Iseconds)Z" \
              '{
                candidate: $candidate,
                election: $election,
                yes: $yes,
                no: $no,
                total: $total,
                yesPercent: ($yesPercent | tonumber),
                noPercent: ($noPercent | tonumber),
                lastUpdated: $lastUpdated
              }' > "$results_file"
            
            echo "   ✅ Final: $yes_votes YES, $no_votes NO (new: $new_yes YES, $new_no NO)"
            echo ""
          done
          
          echo "🎉 Vote processing complete"
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
          keep_files: false
