name: Process All Votes
on:
  push:
    paths:
      - 'votes/**/*.json'
      - '!votes/**/results.json'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Process vote directories
        run: |
          echo "=== Processing Votes ==="
          
          # Get unique directories with vote files (ignore archive)
          find votes -type f -name "vote_*.json" ! -path "*/archive/*" 2>/dev/null | while read VOTE_FILE; do
            DIR=$(dirname "$VOTE_FILE")
            echo "Processing: $DIR"
            
            # Process this directory
            bash process-directory.sh "$DIR"
          done
