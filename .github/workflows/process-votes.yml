name: Process Votes and Deploy

on:
  push:
    paths:
      - 'votes/**/*.json'

jobs:
  process-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper git diff

      - name: Setup Node.js (for jq alternative if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Process votes
        id: process
        run: |
          echo "=== Processing Votes ==="
          
          # Track if any changes were made
          CHANGES_MADE=false
          
          # Find all vote files
          while IFS= read -r VOTE_FILE; do
            DIR=$(dirname "$VOTE_FILE")
            
            # Skip if this is an archive directory
            if [[ "$DIR" == *"/archive"* ]]; then
              echo "Skipping archive: $DIR"
              continue
            fi
            
            echo "Processing: $VOTE_FILE"
            
            # Load or create results
            RESULTS_FILE="$DIR/results.json"
            if [ -f "$RESULTS_FILE" ]; then
              YES=$(jq -r '.yes // 0' "$RESULTS_FILE")
              NO=$(jq -r '.no // 0' "$RESULTS_FILE")
              YES_COMMENTS=$(jq -c '.yesComments // []' "$RESULTS_FILE")
              NO_COMMENTS=$(jq -c '.noComments // []' "$RESULTS_FILE")
            else
              YES=0
              NO=0
              YES_COMMENTS='[]'
              NO_COMMENTS='[]'
            fi
            
            # Process this vote file
            VOTE=$(jq -r '.vote' "$VOTE_FILE")
            NOTES=$(jq -r '.notes // ""' "$VOTE_FILE")
            
            # Count vote
            if [[ "$VOTE" == "yes" ]]; then
              YES=$((YES + 1))
            elif [[ "$VOTE" == "no" ]]; then
              NO=$((NO + 1))
            fi
            
            # Add comment if valid
            if [[ "$NOTES" != "Please provide any comments about your vote. These will be visible with the results." ]] && \
               [ -n "$NOTES" ] && [ "$NOTES" != "null" ] && [ "$NOTES" != "" ]; then
              COMMENT=$(jq -n \
                --arg notes "$NOTES" \
                --arg timestamp "$(jq -r '.timestamp' "$VOTE_FILE")" \
                '{notes: $notes, timestamp: $timestamp}')
              
              if [[ "$VOTE" == "yes" ]]; then
                YES_COMMENTS=$(echo "$YES_COMMENTS" | jq --argjson c "$COMMENT" '. + [$c]')
              elif [[ "$VOTE" == "no" ]]; then
                NO_COMMENTS=$(echo "$NO_COMMENTS" | jq --argjson c "$COMMENT" '. + [$c]')
              fi
            fi
            
            # Delete the vote file
            rm -f "$VOTE_FILE"
            CHANGES_MADE=true
            
            # Save updated results
            TOTAL=$((YES + NO))
            if [ $TOTAL -gt 0 ]; then
              YES_PCT=$(echo "scale=1; $YES * 100 / $TOTAL" | bc)
              NO_PCT=$(echo "scale=1; $NO * 100 / $TOTAL" | bc)
            else
              YES_PCT=0
              NO_PCT=0
            fi
            
            # Remove duplicate comments
            YES_COMMENTS=$(echo "$YES_COMMENTS" | jq 'unique_by(.notes + .timestamp)')
            NO_COMMENTS=$(echo "$NO_COMMENTS" | jq 'unique_by(.notes + .timestamp)')
            
            ELECTION=$(basename $(dirname "$DIR"))
            CANDIDATE=$(basename "$DIR")
            
            jq -n \
              --arg e "$ELECTION" \
              --arg c "$CANDIDATE" \
              --argjson y "$YES" \
              --argjson n "$NO" \
              --argjson t "$TOTAL" \
              --arg yp "$YES_PCT" \
              --arg np "$NO_PCT" \
              --argjson yc "$YES_COMMENTS" \
              --argjson nc "$NO_COMMENTS" \
              --arg lu "$(date -Iseconds)" \
              '{
                electionId: $e,
                candidateId: $c,
                yes: $y,
                no: $n,
                total: $t,
                yesPercent: ($yp | tonumber),
                noPercent: ($np | tonumber),
                yesComments: $yc,
                noComments: $nc,
                lastUpdated: $lu
              }' > "$RESULTS_FILE"
            
            echo "✅ $YES YES, $NO NO"
          done < <(find votes -name "vote_*.json" -type f)
          
          echo "=== Done ==="
          echo "changes_made=$CHANGES_MADE" >> $GITHUB_OUTPUT

      - name: Commit results
        if: steps.process.outputs.changes_made == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/
          git commit -m "Update vote results [skip ci]"
          git push

      - name: Setup Pages
        if: steps.process.outputs.changes_made == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.process.outputs.changes_made == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './votes'

      - name: Deploy to GitHub Pages
        if: steps.process.outputs.changes_made == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
