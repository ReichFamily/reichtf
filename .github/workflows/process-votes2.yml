name: Process Votes
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Process votes
        run: |
          DIR="votes/membership-2026/emma-cambridge"
          echo "Processing $DIR"
          
          # Read current results
          if [ -f "$DIR/results.json" ]; then
            yes=$(jq -r '.yes // 0' "$DIR/results.json")
            no=$(jq -r '.no // 0' "$DIR/results.json")
          else
            yes=0
            no=0
          fi
          
          echo "Current: $yes YES, $no NO"
          
          # Count new votes
          for file in "$DIR"/vote_*.json; do
            if [ -f "$file" ]; then
              vote=$(jq -r '.vote' "$file")
              echo "Found vote: $vote"
              
              if [ "$vote" = "yes" ]; then
                yes=$((yes + 1))
              elif [ "$vote" = "no" ]; then
                no=$((no + 1))
              fi
              
              rm "$file"
            fi
          done
          
          echo "New totals: $yes YES, $no NO"
          
          # Save results
          jq -n \
            --argjson y "$yes" \
            --argjson n "$no" \
            --argjson t "$((yes + no))" \
            --arg u "$(date -Iseconds)Z" \
            '{
              candidate: "emma-cambridge",
              election: "membership-2026",
              yes: $y,
              no: $n,
              total: $t,
              lastUpdated: $u
            }' > "$DIR/results.json"
      
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votesname: Process Votes 2
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count votes and update results WITH COMMENTS
        run: |
          echo "=== STARTING VOTE PROCESSING ==="
          
          DIR="votes/membership-2026/emma-cambridge"
          echo "Processing: $DIR"
          
          if [ ! -d "$DIR" ]; then
            echo "ERROR: Directory not found"
            exit 1
          fi
          
          results_file="$DIR/results.json"
          
          # Read existing counts
          if [ -f "$results_file" ]; then
            yes_votes=$(jq -r '.yes // 0' "$results_file")
            no_votes=$(jq -r '.no // 0' "$results_file")
            echo "Existing: $yes_votes YES, $no_votes NO"
          else
            yes_votes=0
            no_votes=0
          fi
          
          # Arrays for comments
          yes_comments=()
          no_comments=()
          new_yes=0
          new_no=0
          
          # SINGLE PASS: Process each vote file once
          for vote_file in "$DIR"/vote_*.json; do
            if [ -f "$vote_file" ]; then
              echo "Processing: $(basename "$vote_file")"
              
              # Extract data
              vote=$(jq -r '.vote' "$vote_file" 2>/dev/null || echo "")
              notes=$(jq -r '.notes // ""' "$vote_file" 2>/dev/null || echo "")
              email=$(jq -r '.email // ""' "$vote_file" 2>/dev/null || echo "")
              timestamp=$(jq -r '.timestamp // ""' "$vote_file" 2>/dev/null || echo "")
              
              # Count vote
              if [ "$vote" = "yes" ]; then
                new_yes=$((new_yes + 1))
                yes_votes=$((yes_votes + 1))
                echo "  ✓ YES vote"
              elif [ "$vote" = "no" ]; then
                new_no=$((new_no + 1))
                no_votes=$((no_votes + 1))
                echo "  ✓ NO vote"
              fi
              
              # Collect comment if exists
              if [ -n "$notes" ] && [ "$notes" != "null" ] && [ "$notes" != "" ]; then
                comment_obj=$(jq -n \
                  --arg notes "$notes" \
                  --arg email "$email" \
                  --arg timestamp "$timestamp" \
                  '{notes: $notes, email: $email, timestamp: $timestamp}')
                
                if [ "$vote" = "yes" ]; then
                  yes_comments+=("$comment_obj")
                  echo "  ✓ Has comment"
                elif [ "$vote" = "no" ]; then
                  no_comments+=("$comment_obj")
                  echo "  ✓ Has comment"
                fi
              fi
              
              # Delete file
              rm "$vote_file"
            fi
          done
          
          echo "New votes: $new_yes YES, $new_no NO"
          
          # Calculate percentages
          total_votes=$((yes_votes + no_votes))
          if [ $total_votes -gt 0 ]; then
            yes_percent=$(echo "scale=1; $yes_votes * 100 / $total_votes" | bc)
            no_percent=$(echo "scale=1; $no_votes * 100 / $total_votes" | bc)
          else
            yes_percent=0
            no_percent=0
          fi
          
          # Convert comments to JSON
          yes_comments_json=$(printf '%s\n' "${yes_comments[@]}" | jq -s '.')
          no_comments_json=$(printf '%s\n' "${no_comments[@]}" | jq -s '.')
          
          # Write results
          jq -n \
            --arg candidate "emma-cambridge" \
            --arg election "membership-2026" \
            --argjson yes "$yes_votes" \
            --argjson no "$no_votes" \
            --argjson total "$total_votes" \
            --arg yesPercent "$yes_percent" \
            --arg noPercent "$no_percent" \
            --argjson yesComments "$yes_comments_json" \
            --argjson noComments "$no_comments_json" \
            --arg lastUpdated "$(date -Iseconds)Z" \
            '{
              candidate: $candidate,
              election: $election,
              yes: $yes,
              no: $no,
              total: $total,
              yesPercent: ($yesPercent | tonumber),
              noPercent: ($noPercent | tonumber),
              yesComments: $yesComments,
              noComments: $noComments,
              lastUpdated: $lastUpdated
            }' > "$results_file"
          
          echo "Final: $yes_votes YES, $no_votes NO"
          echo "Comments: YES=${#yes_comments[@]}, NO=${#no_comments[@]}"
          echo "=== COMPLETE ==="
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
          force_orphan: true
