name: Process Votes 2
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  process-votes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Process votes
        run: |
          DIR="votes/membership-2026/emma-cambridge"
          echo "Processing $DIR"
          
          # Read current results
          if [ -f "$DIR/results.json" ]; then
            yes=$(jq -r '.yes // 0' "$DIR/results.json")
            no=$(jq -r '.no // 0' "$DIR/results.json")
          else
            yes=0
            no=0
          fi
          
          echo "Current: $yes YES, $no NO"
          
          # Count new votes
          for file in "$DIR"/vote_*.json; do
            if [ -f "$file" ]; then
              vote=$(jq -r '.vote' "$file")
              echo "Found vote: $vote"
              
              if [ "$vote" = "yes" ]; then
                yes=$((yes + 1))
              elif [ "$vote" = "no" ]; then
                no=$((no + 1))
              fi
              
              rm "$file"
            fi
          done
          
          echo "New totals: $yes YES, $no NO"
          
          # Save results
          jq -n \
            --argjson y "$yes" \
            --argjson n "$no" \
            --argjson t "$((yes + no))" \
            --arg u "$(date -Iseconds)Z" \
            '{
              candidate: "emma-cambridge",
              election: "membership-2026",
              yes: $y,
              no: $n,
              total: $t,
              lastUpdated: $u
            }' > "$DIR/results.json"
      
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./votes
