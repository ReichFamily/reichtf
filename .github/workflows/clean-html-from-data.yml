name: Clean HTML from Data Branch
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
      
      - name: Remove HTML files from votes folder
        run: |
          echo "Current files in votes/:"
          find votes -type f
          
          echo "Removing HTML files..."
          find votes -name "*.html" -type f -delete
          find votes -name "*.htm" -type f -delete
          
          echo "Remaining files:"
          find votes -type f || echo "No files found"
      
      - name: Commit cleanup
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add votes/
          git status
          git commit -m "Remove HTML files from votes folder" || echo "No changes to commit"
          git push origin data
